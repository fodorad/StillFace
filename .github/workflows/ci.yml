name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    env:
      UV_NO_SYNC: "1"  # make targets use the environment synced above
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          enable-cache: true

      - name: Set up ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d  # v3.1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: make lint

      - name: Type check
        run: make type-check

      - name: Test and coverage
        run: make test

      - name: Debug ffmpeg (temporary)
        if: failure()
        run: |
          ffmpeg -version | head -2
          ffmpeg -hide_banner -y -f lavfi -i testsrc=size=64x48:rate=25:duration=1 -pix_fmt yuv420p /tmp/w.MTS 2>&1 | tail -5
          ffprobe -hide_banner /tmp/w.MTS 2>&1 | tail -5
          ffmpeg -hide_banner -y -i /tmp/w.MTS -r 60 /tmp/o.mp4 2>&1 | tail -8

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Build docs
        run: make docs
