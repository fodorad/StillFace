# Default gaze extraction settings. Thresholds and zones are provisional until they are
# calibrated on the development sessions.
version = 1
sample_rate_hz = 30.0
model_variant = "vitl14_inout_childplay"

[side_priors]
window = "right"
window_baseline = "left"
door = "left"
door_baseline = "left"

[thresholds]
partner_mass = 0.3
inout = 0.5
box_margin = 0.25

[roles]
min_presence = 0.2
min_side_separation = 0.05
min_relative_head_area = 0.1
min_owner_score = 0.5
min_owner_area = 0.005
