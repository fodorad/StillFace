# Default gaze extraction settings. Thresholds and zones are provisional until they are
# calibrated on the development sessions.
version = 1
sample_rate_hz = 30.0
model_variant = "vitl14_inout_childplay"

[side_priors]
window = "right"
door = "left"

[thresholds]
partner_mass = 0.3
inout = 0.5
box_margin = 0.25

[roles]
min_presence = 0.2
size_ambiguity_ratio = 0.8
min_side_separation = 0.05
min_identity_similarity = 0.3
min_relative_head_area = 0.4
