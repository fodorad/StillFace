# Default audio pipeline settings. Thresholds are vendor or probe defaults until they are
# tuned on annotations; every value is recorded in the run records.
version = 1

[source]
# Tried in order. The baby-cam phone sits next to the mother's head; the side camcorders
# are fallbacks. The mother-cam phone is not used by default.
cameras = ["baby", "window", "door"]

[scope]
analysis_column = "Analysis"
exclude = []

[inventory]
frame_s = 0.05
silence_dbfs = -60.0
clip_level = 0.999

[roles]
# Baby = KCHI or OCH (no siblings). Female segments are the mother when their speaker
# embedding is close to her enrolled voice (longest play-phase FEM speech without baby
# overlap, up to 30 s); placeholder thresholds until tuned on annotations.
vtc_model = "vtc"
embedding_model = "pyannote_embedding"
baby_labels = ["KCHI", "OCH"]
enrol_phase = "play"
fallback_phase = "reunion"
enrol_total_s = 30.0
enrol_min_s = 8.0
tau_high = 0.6
tau_low = 0.4

[fusion]
disagreement_listen_share = 0.2

# Thresholds: value and where it comes from (vendor default, probe, or config placeholder).
[fusion.thresholds.silero]
value = 0.5
origin = "vendor"
[fusion.thresholds.pyannote]
value = 0.5
origin = "vendor"
[fusion.thresholds.ast_type]
value = 0.2
origin = "probe"
[fusion.thresholds.littlebeats]
value = 0.5
origin = "config"
[fusion.thresholds.gong]
value = 0.2
origin = "probe"
[fusion.thresholds.context]
value = 0.2
origin = "probe"

[fusion.gong]
classes = ["Gong", "Bell", "Chime", "Singing bowl"]
edge_s = 5.0
dilate_s = 0.5

[fusion.context]
classes = [
  "Music", "Television", "Radio", "Speech synthesizer", "Rattle", "Squeak", "Walk, footsteps",
  "Door", "Knock", "Telephone", "Mechanical fan", "Air conditioning", "White noise",
]
listen_share = 0.2

# Baby vocalisation types: inside baby segments a model votes for a type when one of its
# classes reaches the model's threshold; no vote = other_vocal, a tie = conflict.
[fusion.baby_types.cry]
ast = ["Baby cry, infant cry", "Crying, sobbing", "Wail, moan"]
littlebeats = ["CRY"]
[fusion.baby_types.fuss]
ast = ["Whimper"]
littlebeats = ["FUS"]
[fusion.baby_types.laugh]
ast = ["Baby laughter", "Laughter", "Giggle"]
[fusion.baby_types.babble]
ast = ["Babbling"]
littlebeats = ["BAB"]

# Mother vocalisation types from AST inside mother segments; speech is the default.
[fusion.mother_types.singing]
ast = ["Singing", "Female singing", "Lullaby"]
[fusion.mother_types.humming]
ast = ["Humming"]
[fusion.mother_types.laughter]
ast = ["Laughter", "Giggle", "Chuckle, chortle", "Belly laugh"]

[gating]
# Mother-only / baby-only tracks keep the original samples inside role segments widened by
# pad_s, silence elsewhere; overlaps are listed, not separated (phase 1).
pad_s = 0.3

[affect]
# Baby valence = -1 p(cry) - 0.5 p(fuss) + 1 p(laugh); arousal = mean of the session-scaled
# loudness, F0 and p(cry). Equal weights until the descriptive statistics.
baby_arousal_features = ["intensity", "f0", "cry"]
min_agreement_frames = 20
[affect.baby_valence_weights]
cry = -1.0
fuss = -0.5
laugh = 1.0

[prepare]
# 16-bit PCM mono, no gain or normalisation: levels stay comparable across sessions.
sample_rate = 16000

# ── Models ─────────────────────────────────────────────────────────────────────
# In-process models have no `env`. Subprocess models name their environment below
# $STILLFACE_AUDIO_ENVS, the worker module and the exact weights revision.

[models.prosody]
# Parselmouth (Praat) F0 in two ranges, intensity and HNR every 10 ms.
[models.prosody.options]
time_step = "0.01"
adult_f0_min = "100"
adult_f0_max = "700"
infant_f0_min = "150"
infant_f0_max = "1000"

[models.egemaps]
# openSMILE eGeMAPS v02 functionals per role segment.
input = "segments"
segment_source = "roles:mother,baby"

[models.silero]
# Silero VAD, weights bundled with the pinned package (envs/audio/vad).
env = "vad"
module = "stillface.features.audio.workers.silero"
weights_revision = "silero-vad==6.3"
device = "cpu"

[models.ast]
# AST AudioSet, 2 s windows, 0.25 s hop (probe settings).
env = "hf"
module = "stillface.features.audio.workers.ast_audioset"
weights_revision = "f826b80d28226b62986cc218e5cec390b1096902"
window_s = 2.0
hop_s = 0.25

[models.vtc]
# VTC 2.2 voice types (KCHI, OCH, MAL, FEM) every 20 ms; weights_revision is the coml/VTC-2
# commit at the time of pinning (the vtc package resolves model "2.2").
env = "vtc"
module = "stillface.features.audio.workers.vtc"
weights_revision = "91167f6103c1f211bb9861f32d57e92ed01618b9"
[models.vtc.options]
vtc_version = "2.2"
thresholds = "f1"

[models.addressee]
# KCDS / ADS / Other per adult VTC segment (coml/addressee), 10 s context, <= 30 s parts.
env = "vtc"
module = "stillface.features.audio.workers.addressee"
weights_revision = "080532e23a25ad08e40a8c183bb522380e916f62"
input = "segments"
segment_source = "vtc:FEM,MAL"

[models.pyannote_vad]
# pyannote community-1 segmentation: speech probability (third VAD opinion). Gated: HF_TOKEN.
env = "vad"
module = "stillface.features.audio.workers.pyannote_worker"
weights_revision = "3533c8cf8e369892e6b79ff1bf80f7b0286a54ee"

[models.pyannote_embedding]
# pyannote community-1 speaker embeddings per female segment (mother enrolment). Gated.
env = "vad"
module = "stillface.features.audio.workers.pyannote_worker"
weights_revision = "3533c8cf8e369892e6b79ff1bf80f7b0286a54ee"
input = "segments"
segment_source = "vtc:FEM"

[models.littlebeats]
# LittleBeats wav2vec2 (LL_4300 fine-tuned): speaker / infant / adult vocalisation heads on
# 2 s windows. Disabled until its environment builds (fairseq) and its outputs are checked.
env = "littlebeats"
module = "stillface.features.audio.workers.littlebeats"
weights_revision = "b3250219066482f571ef3868413b0b0f1ad92502"
window_s = 2.0
hop_s = 1.0
enabled = false

[models.audeering]
# audEERING MSP-dim: arousal / dominance / valence per 3 s window (0.5 s hop) inside
# mother segments (baby segments: experimental).
env = "hf"
module = "stillface.features.audio.workers.audeering"
weights_revision = "6eba34a2485ea31cb03600241787c3a5edab8626"
window_s = 3.0
hop_s = 0.5
input = "segments"
segment_source = "roles:mother,baby"

[models.emotion2vec]
# emotion2vec+ large: 9 emotion categories per 3 s window (0.5 s hop), cross-check.
env = "e2v"
module = "stillface.features.audio.workers.emotion2vec"
weights_revision = "6c303ba987b86b93193de93e34bb2b077a6bedc4"
window_s = 3.0
hop_s = 0.5
input = "segments"
segment_source = "roles:mother"

[models.crisperwhisper]
# CrisperWhisper 2.0 large on the mother-only track: verbatim and intended transcripts.
env = "cw2"
module = "stillface.features.audio.workers.crisperwhisper"
weights_revision = "f4334f6e8193f2691212d49b20fa12d370e13896"
[models.crisperwhisper.options]
track = "mother"
language = "hu"

[models.mfa]
# Montreal Forced Aligner, Hungarian CV dictionary and acoustic model (XPF phones).
env = "mfa"
module = "stillface.features.audio.workers.mfa"
weights_revision = "hungarian_cv-2.0.0"
device = "cpu"
input = "segments"
segment_source = "asr:mother"
[models.mfa.options]
dictionary = "hungarian_cv"
acoustic_model = "hungarian_cv"
